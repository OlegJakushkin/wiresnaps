<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WireSnaps engine checks</title><style>body{font:16px system-ui;background:#f7f6f0;color:#304b3c;margin:3rem auto;max-width:900px;padding:0 1rem}pre{background:#fff;padding:1rem;border-radius:8px;white-space:pre-wrap}a{color:#477e61}</style><h1>Engine checks</h1><p>The same C++ tests used by the native engine run here as WebAssembly. All files are local to this website.</p><p id="status">Running fixtures…</p><pre id="output"></pre><a href="../">Back to the workbench</a><script type="module">
const output=document.querySelector('#output');let failed=false;
for(const name of ['core','mcu','physics']){let status;try{const {default:run}=await import('./'+name+'_tests.mjs');await run({print:line=>output.textContent+=line+'\n',printErr:line=>output.textContent+=line+'\n',onExit:code=>status=code});}catch(e){status=e.status??1;output.textContent+=String(e.message??e)+'\n';}if(status!==0)failed=true;}
document.querySelector('#status').textContent=failed?'A fixture failed':'All fixtures passed';document.body.dataset.passed=String(!failed);
</script></html>
